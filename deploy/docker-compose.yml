# FreeScout — single-VPS deployment.
#
# Quick start:
#   1. cp deploy/.env.example deploy/.env
#   2. Fill in passwords, APP_URL, mail settings.
#   3. docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   4. Browse to APP_URL and complete the FreeScout web installer.
#
# Reverse proxy (Caddy / nginx / Traefik) is expected to terminate TLS and
# forward to ${APP_PORT:-8080} on the host.

services:
  app:
    image: tiredofit/freescout:${FREESCOUT_IMAGE_TAG:-latest}
    container_name: freescout-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      VIRTUAL_HOST: ${APP_HOST}
      SITE_URL: ${APP_URL}

      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-freescout}
      DB_USER: ${DB_USER:-freescout}
      DB_PASS: ${DB_PASSWORD}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASS: ${ADMIN_PASSWORD}

      DISPLAY_ERRORS: "FALSE"
      ENABLE_SMTP: ${ENABLE_SMTP:-TRUE}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-FreeScout}

      TIMEZONE: ${TIMEZONE:-UTC}

      CONTAINER_ENABLE_MONITORING: "FALSE"
    volumes:
      - freescout_data:/www/html
      - freescout_logs:/www/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:10.11
    container_name: freescout-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-freescout}
      MARIADB_USER: ${DB_USER:-freescout}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - freescout_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  freescout_data:
  freescout_logs:
  freescout_db:
